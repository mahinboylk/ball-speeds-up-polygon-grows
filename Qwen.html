<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolving Polygon Bounce</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #05050a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: white;
        user-select: none;
    }
    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
    }
    #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 18px;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.4);
        padding: 15px 20px;
        border-radius: 10px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 10;
    }
    #ui div {
        margin: 5px 0;
    }
    .label {
        color: #aaa;
        font-weight: 300;
    }
    .value {
        font-weight: bold;
        color: #fff;
        margin-left: 10px;
        font-variant-numeric: tabular-nums;
    }
    #reset-hint {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.3);
        font-size: 14px;
        pointer-events: none;
        z-index: 10;
    }
</style>
</head>
<body>
<div id="ui">
    <div><span class="label">Sides:</span><span class="value" id="sides">3</span></div>
    <div><span class="label">Speed:</span><span class="value" id="speed">0</span></div>
</div>
<div id="reset-hint">Click anywhere to reset</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sidesEl = document.getElementById('sides');
    const speedEl = document.getElementById('speed');

    let N = 3;
    let cx, cy, R;
    let lastCollision = 0;
    
    let ball = {
        x: 0, y: 0,
        vx: 0, vy: 0,
        r: 12
    };

    let trail = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        cx = canvas.width / 2;
        cy = canvas.height / 2;
        R = Math.min(canvas.width, canvas.height) * 0.4;
    }

    function reset() {
        N = 3;
        ball.x = cx;
        ball.y = cy;
        let angle = Math.random() * Math.PI * 2;
        let initialSpeed = 4;
        ball.vx = Math.cos(angle) * initialSpeed;
        ball.vy = Math.sin(angle) * initialSpeed;
        trail = [];
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('click', reset);
    resize();
    reset();

    function getVertices(n, r, cx, cy) {
        let verts = [];
        let rotation = -Math.PI / 2; // Keep one vertex pointing straight up
        for (let i = 0; i < n; i++) {
            let angle = (i * 2 * Math.PI / n) + rotation;
            verts.push({
                x: cx + r * Math.cos(angle),
                y: cy + r * Math.sin(angle)
            });
        }
        return verts;
    }

    function update() {
        let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        
        // Sub-stepping to prevent tunneling through walls at high speeds
        let steps = Math.ceil(speed / 5); 
        if (steps < 1) steps = 1;
        let dt = 1 / steps;

        let verts = getVertices(N, R, cx, cy);

        for (let step = 0; step < steps; step++) {
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            for (let i = 0; i < verts.length; i++) {
                let A = verts[i];
                let B = verts[(i + 1) % verts.length];

                let ABx = B.x - A.x;
                let ABy = B.y - A.y;
                let APx = ball.x - A.x;
                let APy = ball.y - A.y;

                // Project ball center onto the line segment
                let t = (APx * ABx + APy * ABy) / (ABx * ABx + ABy * ABy);
                t = Math.max(0, Math.min(1, t));

                let Cx = A.x + t * ABx;
                let Cy = A.y + t * ABy;

                let dx = ball.x - Cx;
                let dy = ball.y - Cy;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist <= ball.r) {
                    // Calculate normal vector
                    let nx = 0, ny = 0;
                    if (dist === 0) {
                        let len = Math.sqrt(ABx * ABx + ABy * ABy);
                        nx = -ABy / len;
                        ny = ABx / len;
                    } else {
                        nx = dx / dist;
                        ny = dy / dist;
                    }

                    // Ensure normal points inward (towards center)
                    let dot = nx * (cx - Cx) + ny * (cy - Cy);
                    if (dot < 0) {
                        nx = -nx;
                        ny = -ny;
                    }

                    // Reflect velocity
                    let dotV = ball.vx * nx + ball.vy * ny;
                    ball.vx -= 2 * dotV * nx;
                    ball.vy -= 2 * dotV * ny;

                    // Push ball out of wall
                    ball.x = Cx + nx * ball.r;
                    ball.y = Cy + ny * ball.r;

                    // --- COLLISION EFFECTS ---
                    ball.vx *= 1.05; // Gain speed
                    ball.vy *= 1.05;
                    N++;             // Add one side
                    lastCollision = Date.now();

                    // Recalculate vertices for the new shape immediately
                    verts = getVertices(N, R, cx, cy);
                    
                    // Break segment loop to avoid double collisions in same substep
                    break; 
                }
            }
        }

        // Max speed cap to prevent chaotic infinite acceleration
        let maxSpeed = 80;
        let currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        if (currentSpeed > maxSpeed) {
            ball.vx = (ball.vx / currentSpeed) * maxSpeed;
            ball.vy = (ball.vy / currentSpeed) * maxSpeed;
        }

        // Record trail
        trail.push({x: ball.x, y: ball.y, hue: (N * 15) % 360, n: N});
        if (trail.length > 40) {
            trail.shift();
        }
    }

    function draw() {
        // Draw Background
        let grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.5);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(1, '#05050a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Trail
        for (let i = 0; i < trail.length; i++) {
            let t = trail[i];
            let alpha = i / trail.length;
            ctx.beginPath();
            ctx.arc(t.x, t.y, ball.r * alpha, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${t.hue}, 100%, 70%, ${alpha * 0.5})`;
            ctx.fill();
        }

        let verts = getVertices(N, R, cx, cy);
        let hue = (N * 15) % 360;
        
        // Calculate "flash" effect on collision
        let timeSinceCollision = Date.now() - lastCollision;
        let flash = Math.max(0, 1 - timeSinceCollision / 300); // 300ms flash duration

        // Draw Polygon
        ctx.beginPath();
        ctx.moveTo(verts[0].x, verts[0].y);
        for (let i = 1; i < verts.length; i++) {
            ctx.lineTo(verts[i].x, verts[i].y);
        }
        ctx.closePath();

        ctx.lineWidth = 4 + flash * 12;
        ctx.strokeStyle = `hsl(${hue}, 100%, ${50 + flash * 50}%)`;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
        ctx.shadowBlur = 20 + flash * 30;
        ctx.stroke();
        
        // Reset shadow
        ctx.shadowBlur = 0;

        // Draw Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.shadowColor = 'white';
        ctx.shadowBlur = 15;
        ctx.fill();
        
        // Reset shadow again
        ctx.shadowBlur = 0;

        // Update UI text
        sidesEl.innerText = N;
        let currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy).toFixed(1);
        speedEl.innerText = currentSpeed;
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
